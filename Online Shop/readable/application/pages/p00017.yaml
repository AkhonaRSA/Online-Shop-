- # ====== Region: Order Details ===============================
  id: 109763471485262285405
  identification: 
    name: Order Details
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT o.order_id,
          o.order_datetime,
          o.customer_id,
          o.order_status,
          o.store_id,
          (SELECT Sum(unit_price * quantity)
              FROM   order_items i
              WHERE  i.order_id = o.order_id) total
      FROM   orders o
      WHERE  order_id = :P17_ORDER

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: 'Order: &P17_ORDER.' # 109763471390311285404
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
