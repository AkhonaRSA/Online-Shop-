- # ====== Region: Items =======================================
  id: 109763471775983285408
  identification: 
    name: Items
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT  o.line_item_id                Item,
              p.product_name                Product,
              o.unit_price,
              o.quantity,
              ( o.unit_price * o.quantity ) Subtotal,
              p.product_image
      FROM   order_items o,
          products p
      WHERE  p.product_id = o.product_id
      AND  order_id = :P17_ORDER

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: Order Details # 109763471485262285405
