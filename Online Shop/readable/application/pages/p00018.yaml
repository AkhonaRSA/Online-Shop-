processes: 
- # ====== Process: Checkout ===================================
  id: 109763473742193285428
  identification: 
    name: Checkout
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          MANAGE_ORDERS.create_order (
                                      p_customer       => :P18_CUSTOMER_FULLNAME,
                                      p_customer_email => :P18_CUSTOMER_EMAIL,
                                      p_store          => :P18_STORE,
                                      p_order_id       => :P18_ORDER_ID,
                                      p_customer_id    => :P18_CUSTOMER_ID);
      END;
      
      

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: 'Order successfully created: &P18_ORDER_ID.'

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Proceed # 109763473268688285423

- # ====== Process: Clear Shopping Cart  =======================
  id: 109763473864981285429
  identification: 
    name: 'Clear Shopping Cart '
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          manage_orders.clear_cart;
      END;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Clear # 109763473300558285424

