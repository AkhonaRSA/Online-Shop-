dynamic-actions: 
- # ====== Dynamic Action: Update Shopping Cart Header =========
  id: 109763474334212285434
  identification: 
    name: Update Shopping Cart Header

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Dialog Closed
    selection-type: Region
    region: 'Shopping Cart ' # 109763471921149285410

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: parseInt(this.data.P19_SHOPPING_CART_ITEMS) > 0

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 109763474458124285435
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // Update Badge Text
        apex.jQuery(".js-shopping-cart-item .t-Button-badge").text(this.data.P19_SHOPPING_CART_ITEMS);
        
        // Update Icon
        apex.jQuery(".js-shopping-cart-item .t-Icon").removeClass('fa-cart-empty').addClass('fa-cart-full');

    execution: 
      sequence: 10
      event: Update Shopping Cart Header # 109763474334212285434
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 109763474578489285436
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: 'Shopping Cart ' # 109763471921149285410

    execution: 
      sequence: 20
      event: Update Shopping Cart Header # 109763474334212285434
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute JavaScript Code =====================
    id: 109763474662807285437
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // Update Badge Text
        apex.jQuery(".js-shopping-cart-item .t-Button-badge").text('');
        
        // Update Icon
        apex.jQuery(".js-shopping-cart-item .t-Icon").removeClass('fa-cart-full').addClass('fa-cart-empty');

    execution: 
      sequence: 10
      event: Update Shopping Cart Header # 109763474334212285434
      fire-when-event-result-is: False
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 109763474731490285438
    identification: 
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: 'Shopping Cart ' # 109763471921149285410

    execution: 
      sequence: 20
      event: Update Shopping Cart Header # 109763474334212285434
      fire-when-event-result-is: False
      fire-on-initialization: false

