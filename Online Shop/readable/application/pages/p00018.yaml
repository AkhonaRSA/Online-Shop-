regions: 
- # ====== Region: Shopping Cart  ==============================
  id: 109763471921149285410
  identification: 
    name: 'Shopping Cart '
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT seq_id item,
          p.product_image,
          p.product_id,
          p.product_name name,
          p.unit_price,
          n002               quantity,
          p.unit_price* n002 subtotal,
          b.brand
      FROM   apex_collections a,
          products p,
          json_table (p.product_details, '$' columns ( brand varchar2(4000) path '$.brand') ) b
      WHERE  collection_name = 'PRODUCTS'
      AND    p.product_id = a.n001

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 109763472041961285411
    appearance: 
      layout: Horizontal (Row)

    card: 
      primary-key-column-1: ITEM

    title: 
      advanced-formatting: false
      column: NAME

    subtitle: 
      advanced-formatting: false
      column: BRAND

    body: 
      advanced-formatting: true
      html-expression: 'Quantity: &QUANTITY.'

    secondary-body: 
      advanced-formatting: true
      html-expression: |
        <b>Unit Price: &UNIT_PRICE. </b> <BR>
        <b>Subtotal: &SUBTOTAL. </b>

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: BLOB Column
      blob-column: PRODUCT_IMAGE
      position: Body
      appearance: Auto
      sizing: Fit

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    messages: 
      when-no-data-found: Your Shopping Cart is empty!
      no-data-found-icon: fa-cart-empty

    actions: 
    - # ====== Action: Edit  =======================================
      id: 109763472107113285412
      identification: 
        type: Button
        label: 'Edit '

      layout: 
        position: Primary
        sequence: 10

      link: 
        type: Redirect to Page in this Application
