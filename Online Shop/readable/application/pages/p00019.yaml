computations: 
- # ====== Computation: P19_QUANTITY ===========================
  id: 109976926161113294117
  identification: 
    item-name: P19_QUANTITY

  execution: 
    sequence: 10
    point: Before Header

  computation: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: 'RETURN manage_orders.product_exists(p_product => :P19_PRODUCT_ID);'

processes: 
- # ====== Process: Add product ================================
  id: 109976926210942294118
  identification: 
    name: Add product
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          IF manage_orders.product_exists(p_product => :P19_PRODUCT_ID) = 0 THEN
              manage_orders.add_product (p_product  => :P19_PRODUCT_ID,
                                      p_quantity => :P19_QUANTITY);
          END IF;
          :P19_ACTION := 'ADD';
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Add # 109976926089637294116

- # ====== Process: Edit product ===============================
  id: 109976926339857294119
  identification: 
    name: Edit product
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          IF  manage_orders.product_exists(p_product => :P19_PRODUCT_ID) > 0 THEN
              manage_orders.remove_product(p_product => :P19_PRODUCT_ID);
              manage_orders.add_product (p_product  => :P19_PRODUCT_ID,
                                      p_quantity => :P19_QUANTITY);
          END IF;
          :P19_ACTION := 'EDIT';
      END;

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Edit # 109976925700263294113

- # ====== Process: Delete product =============================
  id: 109976926403323294120
  identification: 
    name: Delete product
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          IF manage_orders.product_exists(p_product => :P19_PRODUCT_ID) > 0 THEN
              manage_orders.remove_product(p_product => :P19_PRODUCT_ID);
          END IF;
          :P19_ACTION := 'DELETE';
      END;

  execution: 
    sequence: 30
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Delete # 109976925822611294114

