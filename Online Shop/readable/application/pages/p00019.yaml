- # ====== Region: Product =====================================
  id: 109763475087421285441
  identification: 
    name: Product
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT product_id,
          product_name,
          unit_price,
          product_details,
          product_image,
          image_mime_type,
          image_filename,
          image_charset,
          image_last_updated,
          color_id,
          department_id,
          clothing_id,
          d.description, 
          b.brand
      FROM   products p,
          json_table (p.product_details, '$' columns ( description varchar2(4000) path '$.description') ) d,
          json_table (p.product_details, '$' columns ( brand       varchar2(4000) path '$.brand') ) b
      WHERE  product_id = :p19_product_id

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--styleC
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 109763475140333285442
    appearance: 
      layout: Float

    card: 
      primary-key-column-1: PRODUCT_ID

    title: 
      advanced-formatting: false
      column: PRODUCT_NAME

    subtitle: 
      advanced-formatting: false
      column: BRAND

    body: 
      advanced-formatting: false
      column: DESCRIPTION

    secondary-body: 
      advanced-formatting: true
      html-expression: 'Price: &UNIT_PRICE.'

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: BLOB Column
      blob-column: PRODUCT_IMAGE
      position: First
      appearance: Auto
      sizing: Fit

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

- # ====== Region: Customer Reviews ============================
  id: 109976924939278294105
  identification: 
    name: Customer Reviews
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT m.rating,
          m.review
      FROM   products p,
          product_reviews m
      WHERE  p.product_name = m.product_name
          AND p.product_id = :p19_product_id
          order by m.rating desc

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 109976925078841294106
    appearance: 
      layout: Horizontal (Row)

    title: 
      advanced-formatting: true
      html-expression: |
        <b>Review:</b> &REVIEW. <br>
        <b>Rating:</b> &RATING.

    subtitle: 
      advanced-formatting: false

    body: 
      advanced-formatting: false

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: No Media

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    messages: 
      when-no-data-found: There are no customer reviews yet.

