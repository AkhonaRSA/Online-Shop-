- # ====== Region: Search Results ==============================
  id: 108781396552325880020
  identification: 
    name: Search Results
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT "PRODUCT_ID",
          "PRODUCT_NAME",
          "UNIT_PRICE",
          "PRODUCT_DETAILS",
          "PRODUCT_IMAGE",
          "IMAGE_MIME_TYPE",
          "IMAGE_FILENAME",
          "IMAGE_CHARSET",
          "IMAGE_LAST_UPDATED",
          "COLOR_ID",
          (
                  SELECT l1."COLOR"
                  FROM   "COLOR_LOOKUP" l1
                  WHERE  l1."COLOR_ID" = m."COLOR_ID") "COLOR_ID_L$1",
          "DEPARTMENT_ID",
          (
                  SELECT l2."DEPARTMENT"
                  FROM   "DEPARTMENT_LOOKUP" l2
                  WHERE  l2."DEPARTMENT_ID" = m."DEPARTMENT_ID") "DEPARTMENT_ID_L$2",
          "CLOTHING_ID",
          (
                  SELECT l3."CLOTHING"
                  FROM   "CLOTHING_LOOKUP" l3
                  WHERE  l3."CLOTHING_ID" = m."CLOTHING_ID") "CLOTHING_ID_L$3",
          b.brand
      FROM   "PRODUCTS" m,
          json_table (m.product_details, '$' columns ( brand varchar2(4000) path '$.brand') ) b

  order-by: 
    type: Item
    item: 
      item-name: P1_ORDER_BY
      order-bys: 
      - key: PRODUCT_NAME
        clause: '"PRODUCT_NAME" asc'

      - key: IMAGE_MIME_TYPE
        clause: '"IMAGE_MIME_TYPE" asc'

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--styleA
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 108781398954203880027
    appearance: 
      layout: Grid
      grid-columns: Auto

    card: 
      primary-key-column-1: PRODUCT_ID

    title: 
      advanced-formatting: false
      column: PRODUCT_NAME

    subtitle: 
      advanced-formatting: true
      html-expression: |
        <small>&BRAND.</small><br />
        <b class="u-success-text u-pullRight" id="message_&PRODUCT_ID.">
        {if QUANTITY/} &QUANTITY. in cart {endif/}
        </b>
        <b>$&UNIT_PRICE.</b>

    body: 
      advanced-formatting: false
      column: IMAGE_MIME_TYPE

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: BLOB Column
      blob-column: PRODUCT_IMAGE
      position: First
      appearance: Widescreen
      sizing: Fit

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

    actions: 
    - # ====== Action: Full Card ===================================
      id: 109976928318377294139
      identification: 
        type: Full Card

      layout: 
        sequence: 10

      link: 
        type: Redirect to Page in this Application
        target: 
          url: 'f?p=&APP_ID.:19:&SESSION.::&DEBUG.::P19_PRODUCT_ID:&PRODUCT_ID.'
          page: 19 # Add to Cart
          values: 
            p19_product_id: '&PRODUCT_ID.'

