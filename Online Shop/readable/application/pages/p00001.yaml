dynamic-actions: 
- # ====== Dynamic Action: Show Success Message ================
  id: 109976927716917294133
  identification: 
    name: Show Success Message

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Dialog Closed
    selection-type: Region
    region: Search Results # 108781396552325880020

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 109976927875439294134
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var productAction   = this.data.P19_ACTION,
            productQuantity = this.data.P19_QUANTITY,
            productCard$  = apex.jQuery("#message_" + this.data.P19_PRODUCT_ID);
        
        if (productAction === 'ADD') {
            productCard$.text("Added " + productQuantity + " to cart!");
        } else if (productAction === 'EDIT') {
            productCard$.text("Updated quantity to " + productQuantity + "!");
        } else if (productAction === 'DELETE') {
            productCard$.text("Removed from cart!");
        }

    execution: 
      sequence: 10
      event: Show Success Message # 109976927716917294133
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Update Shopping Cart Header  ========
  id: 109976927923542294135
  identification: 
    name: 'Update Shopping Cart Header '

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Dialog Closed
    selection-type: Region
    region: Search Results # 108781396552325880020

  client-side-condition: 
    type: JavaScript expression
    javascript-expression: parseInt(this.data.P19_SHOPPING_CART_ITEMS) > 0

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 109976928019797294136
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // Update Badge Text
        apex.jQuery(".js-shopping-cart-item .t-Button-badge").text(this.data.P19_SHOPPING_CART_ITEMS);
        
        // Update Icon
        apex.jQuery(".js-shopping-cart-item .t-Icon").removeClass('fa-cart-empty').addClass('fa-cart-full');

    execution: 
      sequence: 10
      event: 'Update Shopping Cart Header ' # 109976927923542294135
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Execute JavaScript Code =====================
    id: 109976928183992294137
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        // Update Badge Text
        apex.jQuery(".js-shopping-cart-item .t-Button-badge").text('');
        
        // Update Icon
        apex.jQuery(".js-shopping-cart-item .t-Icon").removeClass('fa-cart-full').addClass('fa-cart-empty');

    execution: 
      sequence: 10
      event: 'Update Shopping Cart Header ' # 109976927923542294135
      fire-when-event-result-is: False
      fire-on-initialization: false

