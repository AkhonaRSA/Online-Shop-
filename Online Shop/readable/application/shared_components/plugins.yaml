  callbacks: 
    api-interface: Procedure with Legacy Attributes [deprecated]

  custom-attributes: 
    substitute-attribute-values: true

  information: 
    version: 1.0
    help-text: Display an image, icon, or initials. Available as a partial template to display a single row.

  custom-attributes: 
  - # ====== Custom Attribute: Type ==============================
    id: 108781268734195879835
    identification: 
      static-id: TYPE
      attribute: 1
      name: Type
      scope: Component

    layout: 
      sequence: 10

    settings: 
      type: Select List
      lov-type: Static
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML

    default: 
      value: IMAGE

    help: 
      help-text: Select the type of content that will be displayed in the avatar.

    examples: 
      demo-value: IMAGE

    entries: 
    - # ====== Entry: Image ========================================
      id: 108781269055456879837
      entry: 
        sequence: 10
        display: Image
        return: IMAGE

      advanced: 
        quick-pick: false

    - # ====== Entry: Initials =====================================
      id: 108781269434184879839
      entry: 
        sequence: 20
        display: Initials
        return: INITIALS

      advanced: 
        quick-pick: false

    - # ====== Entry: Icon =========================================
      id: 108781269861313879839
      entry: 
        sequence: 30
        display: Icon
        return: ICON

      advanced: 
        quick-pick: false

  - # ====== Custom Attribute: Image =============================
    id: 108781270239052879840
    identification: 
      static-id: IMAGE
      attribute: 2
      name: Image
      scope: Component

    layout: 
      sequence: 20

    settings: 
      type: Media
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    condition: 
      depending-on-custom-attribute: Type # 108781268734195879835
      depending-on-condition-type: equal to
      expression: IMAGE
      always-evaluate: true

    help: 
      help-text: |
        <p>Use the Media popup dialog to select a source for the avatar image.</p>
        
        <p>Available options include:
        <ul>
        <li>URL</li>
        <li>BLOB Column</li>
        <li>URL Column</li>
        </ul>
        </p>

    examples: 
      demo-value: '#APEX_FILES#apex_ui/img/favicons/app-artwork-catalog.png'

  - # ====== Custom Attribute: Description =======================
    id: 108781270552700879840
    identification: 
      static-id: DESCRIPTION
      attribute: 3
      name: Description
      scope: Component

    layout: 
      sequence: 55

    settings: 
      type: Text
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      escape-mode: HTML Attribute

    help: 
      help-text: Enter a short description of the image/icon or select a source column from the quick pick options. This will be used as title & alt text for the avatar image/icon.

  - # ====== Custom Attribute: Initials ==========================
    id: 108781270898141879841
    identification: 
      static-id: INITIALS
      attribute: 4
      name: Initials
      scope: Component

    layout: 
      sequence: 40

    settings: 
      type: Session State Value
      common: true
      show-in-wizard: true
      required: false
      translatable: false
      data-types: 
      - Varchar2
      escape-mode: HTML

    condition: 
      depending-on-custom-attribute: Type # 108781268734195879835
      depending-on-condition-type: equal to
      expression: INITIALS
      always-evaluate: true

    help: 
      help-text: Select the source column to be displayed within each avatar. Only varchar2 data types are supported.

  - # ====== Custom Attribute: Icon ==============================
    id: 108781271175253879841
    identification: 
